name: Orbita CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  customer-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install customer app dependencies
        run: npm install --no-audit --no-fund
      - name: Lint customer app
        run: npm run lint
      - name: Build customer app
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

  admin-console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install admin dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check admin console
        run: npm run lint
      - name: Build admin console
        run: npm run build
