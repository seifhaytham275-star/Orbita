name: Package Orbita source
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source archive
        run: |
          zip -r /tmp/Orbita-source.zip . \
            -x ".git/*" "node_modules/*" ".next/*" "release/*" "android/.gradle/*" "android/app/build/*" ".env.local" "*.log"
      - uses: actions/upload-artifact@v4
        with:
          name: Orbita-Source-Code
          path: /tmp/Orbita-source.zip
          if-no-files-found: error
          retention-days: 30
