# Build the hosted ORBITA production release for Android APK and Windows installer.
name: Build Orbita installers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-installers.yml"
      - "package.json"
      - "capacitor.config.ts"
      - "desktop/**"
      - "src/**"
    tags: ["v*"]

permissions:
  contents: read

env:
  ORBITA_WEB_URL: ${{ vars.ORBITA_WEB_URL || 'https://orbita-tau-seven.vercel.app' }}

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate and embed deployment URL
        shell: pwsh
        run: |
          $url = "$env:ORBITA_WEB_URL"
          if ($url -notmatch '^https://') { throw "Set ORBITA_WEB_URL to the deployed HTTPS website." }
          @{ url = $url } | ConvertTo-Json | Set-Content desktop/app-config.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Windows installer
        run: npm run desktop:dist -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Orbita-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Configure preinstalled Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
      - name: Install Android build packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Validate deployment URL
        run: |
          if [[ ! "$ORBITA_WEB_URL" =~ ^https:// ]]; then
            echo "Set ORBITA_WEB_URL to the deployed HTTPS website."
            exit 1
          fi
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Android project
        run: npx cap add android
      - name: Prepare Capacitor web assets
        run: |
          mkdir -p public
          printf '%s\n' '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>Orbita is loading...</body></html>' > public/index.html
          mkdir -p android/app/src/main/assets/public
      - name: Sync hosted Orbita website
        run: npx cap sync android
      - name: Build installable debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Orbita-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
