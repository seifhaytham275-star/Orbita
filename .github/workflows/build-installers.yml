name: Build Orbita installers
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate and embed deployment URL
        shell: pwsh
        run: |
          $url = "${{ vars.ORBITA_WEB_URL }}"
          if ($url -notmatch '^https://') { throw "Set repository variable ORBITA_WEB_URL to the deployed HTTPS website." }
          @{ url = $url } | ConvertTo-Json | Set-Content desktop/app-config.json
      - run: npm install
      - run: npm run desktop:dist
      - uses: actions/upload-artifact@v4
        with:
          name: Orbita-Windows-Installer
          path: release/*.exe
          if-no-files-found: error

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate deployment URL
        run: |
          if [[ ! "$ORBITA_WEB_URL" =~ ^https:// ]]; then
            echo "Set repository variable ORBITA_WEB_URL to the deployed HTTPS website."
            exit 1
          fi
        env:
          ORBITA_WEB_URL: ${{ vars.ORBITA_WEB_URL }}
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
        env:
          ORBITA_WEB_URL: ${{ vars.ORBITA_WEB_URL }}
      - name: Build installable debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Orbita-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
